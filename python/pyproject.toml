[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conjevture"
version = "0.1.0"
description = "Exact Boolean logic over typed uncertain variables and explicit probability models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikola Balic" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/nibzard/conjevture"
Repository = "https://github.com/nibzard/conjevture"
Issues = "https://github.com/nibzard/conjevture/issues"
Changelog = "https://github.com/nibzard/conjevture/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conjevture = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "examples"]
exclude = "tests/typing/negative\\.py"

[[tool.mypy.overrides]]
module = ["tests.*", "typing.*", "positive", "negative"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
